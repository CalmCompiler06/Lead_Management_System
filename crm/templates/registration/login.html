<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f7fc;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-card {
            margin-top: 120px;
            border-radius: 18px;
        }

        .card-header-theme {
            background: linear-gradient(135deg,#1e3c72,#2a5298);
            color: white;
            font-weight: 600;
        }

        .btn-theme {
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 10px;
        }

        .btn-theme:hover {
            background: #1e3c72;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">

            <div class="card login-card shadow-lg">
                <div class="card-header card-header-theme text-center">
                    Login
                </div>

                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}

                        <button type="submit" class="btn btn-theme w-100">
                            Login
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
