{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-lg">

            <div class="card-header card-header-theme">

                <h3 class="mb-0">
                    {{ title }}
                </h3>

            </div>

            <div class="card-body p-4">

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit"
                            class="btn btn-theme">

                        Save Region

                    </button>

                    <a href="{% url 'region_list' %}"
                       class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
