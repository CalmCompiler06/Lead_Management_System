<!DOCTYPE html>
<html>

<head>
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            background: linear-gradient(135deg, #1e3c72, #2a5298);
            position: relative;
        }

        .login-grid {
            min-height: 100vh;
            background-color: #1e3c72;
            background-image:
                linear-gradient(to right,
                    rgba(255, 255, 255, 0.35) 1px,
                    transparent 1px),
                linear-gradient(to bottom,
                    rgba(255, 255, 255, 0.35) 1px,
                    transparent 1px);
            background-size: 70px 70px;
            /* BIGGER GRID */
        }
        .login-card {
    background: white;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}
        /* Grid Background */

        body::before {
            content: "";
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(rgba(255, 255, 255, .06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .06) 1px, transparent 1px);

            background-size: 40px 40px;
            opacity: .5;
        }

        /* Main Card */

        .login-wrapper {
            width: 1000px;
            max-width: 92%;
            min-height: 620px;
            display: flex;
            overflow: hidden;

            border-radius: 22px;
            background: #ffffff;

            box-shadow: 0 25px 60px rgba(0, 0, 0, .25);

            position: relative;
            z-index: 10;
        }

        /* Left Side */

        .left-panel {

            width: 42%;
            padding: 60px 45px;

            background: linear-gradient(135deg, #1e3c72, #2a5298);

            color: white;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left-panel h1 {
            font-size: 58px;
            font-weight: 700;
            line-height: 1;
        }

        .left-panel h2 {
            font-size: 52px;
            font-style: italic;
            color: #9cc6ff;
            margin-top: -8px;
            margin-bottom: 35px;
        }

        .left-panel p {
            font-size: 18px;
            color: #d8e4ff;
            margin-bottom: 30px;
            line-height: 1.7;
        }

        .feature {
            display: flex;
            align-items: center;
            margin: 15px 0;
            font-size: 17px;
            color: white;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 12px;
        }

        .green {
            background: #28c76f;
        }

        .orange {
            background: #ff9f43;
        }

        .blue {
            background: #00cfe8;
        }

        /* Right Side */

        .right-panel {

            width: 58%;
            padding: 70px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            background: #ffffff;
        }

        .right-panel h2 {
            color: #1e3c72;
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .right-panel p {
            color: #6c757d;
            margin-bottom: 40px;
            font-size: 16px;
        }

        /* Labels */

        label {
            font-weight: 600;
            color: #1e3c72;
            margin-bottom: 8px;
            display: block;
        }

        /* Inputs */

        .form-control {

            height: 54px;

            border-radius: 12px;

            border: 1px solid #ced4da;

            font-size: 16px;

            transition: .3s;
        }

        .form-control:focus {

            border-color: #2a5298;

            box-shadow: 0 0 0 .2rem rgba(42, 82, 152, .25);
        }

        /* Login Button */

        .btn-theme {

            width: 100%;

            height: 54px;

            border: none;

            border-radius: 12px;

            margin-top: 15px;

            background: #2a5298;

            color: white;

            font-size: 18px;

            font-weight: 600;

            transition: .3s;
        }

        .btn-theme:hover {

            background: #1e3c72;

            transform: translateY(-2px);
        }

        /* Errors */

        .errorlist {
            list-style: none;
            padding: 0;
            margin-bottom: 10px;
            color: red;
            font-size: 14px;
        }

        /* Responsive */

        @media(max-width:992px) {

            .login-wrapper {

                flex-direction: column;

                min-height: auto;
            }

            .left-panel,
            .right-panel {

                width: 100%;
            }

            .left-panel {

                text-align: center;
                padding: 45px 35px;
            }

            .right-panel {

                padding: 45px 35px;
            }

            .left-panel h1 {

                font-size: 44px;
            }

            .left-panel h2 {

                font-size: 40px;
            }

            .right-panel h2 {

                font-size: 34px;
            }
        }
    </style>

</head>

<body class="login-grid">

    <div class="login-wrapper">

        <div class="row g-0">

            <!-- Left Side -->

            <div class="col-md-5 left-panel">
                <h1>Lead</h1>
                <h2>Management</h2>

                <p>
                    A centralized platform to manage leads, products,
                    regions and sales activities efficiently.
                </p>

                <div class="feature">
                    <span class="dot green"></span>
                    Manage Products
                </div>

                <div class="feature">
                    <span class="dot orange"></span>
                    Track Leads
                </div>

                <div class="feature">
                    <span class="dot blue"></span>
                    Region Management
                </div>

            </div>

            <!-- Right Side -->

            <div class="col-md-7 right-panel">

                <h2>Welcome Back</h2>

                <p>
                    Sign in with your account to continue.
                </p>

                <form method="post">

                    {% csrf_token %}

                    {{ form.non_field_errors }}

                    <div class="mb-3">

                        <label>Username</label>

                        {{ form.username }}

                    </div>

                    <div class="mb-3">

                        <label>Password</label>

                        {{ form.password }}

                    </div>

                    <button class="btn btn-theme w-100" type="submit">
                        Sign In
                    </button>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
