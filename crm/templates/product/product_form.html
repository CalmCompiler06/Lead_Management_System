{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-lg border-0">

            <div class="card-header card-header-theme">

                <h4>{{ title }}</h4>

            </div>

            <div class="card-body">

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit"
                            class="btn btn-theme">

                        Save

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
