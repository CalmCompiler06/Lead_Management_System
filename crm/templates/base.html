<!DOCTYPE html>
<html>
<head>
    <title>Lead Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f4f7fc;
            font-family:'Segoe UI',sans-serif;
        }

        .navbar{
            background:linear-gradient(135deg,#1e3c72,#2a5298);
            box-shadow:0 4px 10px rgba(0,0,0,0.15);
        }

        .navbar-brand{
            font-size:1.5rem;
            font-weight:700;
        }

        .nav-link{
            color:white !important;
            font-weight:500;
        }

        .page-container{
            margin-top:30px;
        }

        .card{
            border:none;
            border-radius:18px;
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
            box-shadow:0 12px 25px rgba(0,0,0,0.15);
        }

        .btn{
            border-radius:10px;
        }

        .card-header-theme{
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    color:white;
    font-weight:600;
}

.btn-theme{
    background:#2a5298;
    color:white;
    border:none;
}

.btn-theme:hover{
    background:#1e3c72;
    color:white;
}

.table thead{
    background:#2a5298;
    color:white;
}

.form-control,
.form-select{
    border-radius:10px;
}

.form-control:focus,
.form-select:focus{
    border-color:#2a5298;
    box-shadow:0 0 0 0.2rem rgba(42,82,152,.25);
}
.btn-edit{
    background:#0dcaf0;
    color:white;
    border:none;
}

.btn-edit:hover{
    background:#0aa2c0;
    color:white;
}
label{
    font-weight:600;
    margin-bottom:5px;
}

.form-control{
    border-radius:10px;
}

.form-control:focus{
    border-color:#2a5298;
    box-shadow:0 0 0 0.2rem rgba(42,82,152,.25);
}

.errorlist{

    color:red;
    font-size:14px;
    list-style:none;
    padding:0;

}

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

    <div class="container">

       <a class="navbar-brand fw-bold" href="{% url 'home' %}">
    Lead Management System
</a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

             <ul class="navbar-nav ms-auto">

    <li class="nav-item">
        <a class="nav-link"
           href="{% url 'home' %}">
            Home
        </a>
    </li>

    <li class="nav-item">
        <a class="nav-link"
           href="{% url 'product_list' %}">
            Products
        </a>
    </li>

    <li class="nav-item">
        <a class="nav-link"
           href="{% url 'region_list' %}">
            Regions
        </a>
    </li>

    <li class="nav-item">
        <a class="nav-link"
           href="{% url 'lead_list' %}">
            Leads
        </a>
    </li>

</ul>
            

        </div>

    </div>

</nav>

<div class="container page-container">

    {% block content %}
    {% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
