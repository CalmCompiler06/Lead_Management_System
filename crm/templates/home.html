{% extends 'base.html' %}

{% block content %}

<div class="text-center mb-5">

    <h1 class="fw-bold">
        Lead Management System
    </h1>

</div>

<div class="row g-4">

    <div class="col-md-4">

        <div class="card shadow h-100">

            <div class="card-body text-center">

                <h3>Products</h3>

                <p class="text-muted">
                    Manage product records
                </p>

                <a href="{% url 'product_list' %}"
                   class="btn btn-primary">
                    Open Products
                </a>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card shadow h-100">

            <div class="card-body text-center">

                <h3>Regions</h3>

                <p class="text-muted">
                    Manage region records
                </p>

                <a href="{% url 'region_list' %}"
                   class="btn btn-success">
                    Open Regions
                </a>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card shadow h-100">

            <div class="card-body text-center">

                <h3>Leads</h3>

                <p class="text-muted">
                    Manage lead records
                </p>

                <a href="{% url 'lead_list' %}"
                   class="btn btn-warning">
                    Open Leads
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
