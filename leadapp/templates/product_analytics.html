<!DOCTYPE html>
<html>
<head>

    <title>Product Analytics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h3>Product Analytics</h3>
        </div>

        <div class="card-body">

            <div class="d-flex justify-content-center">

                <div style="width:900px;height:600px;margin:auto;">

                    <canvas id="productChart"></canvas>

                </div>

            </div>

        </div>

    </div>

</div>

{{ labels|json_script:"product-labels" }}
{{ counts|json_script:"product-counts" }}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const labels =
JSON.parse(
document.getElementById('product-labels').textContent
);

const counts =
JSON.parse(
document.getElementById('product-counts').textContent
);

new Chart(
document.getElementById('productChart'),
{
    type: 'bar',

    data: {

        labels: labels,

        datasets: [{

            label: 'Number of Leads',

            data: counts

        }]
    },

    options: {

        responsive: true,
        maintainAspectRatio: false,

            plugins: {
                legend: {
                    display: true
                }
            },

        scales: {

            x: {
                    ticks: {
                        maxRotation: 90,
                        minRotation: 90
                    }
                },

            y: {

                beginAtZero: true

            }

        }

    }
}
);

</script>

</body>
</html>
