{% extends 'base.html' %}

{% block title %}Region Form{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <h2 class="text-center mb-4">Region Form</h2>

        <div class="card shadow p-4">

            <form method="POST">
                {% csrf_token %}

                <!-- Manually replaced the dropdown with a text input -->
                <div class="form-group mb-3">
                    <label for="id_RegionName" class="form-label">Regionname:</label>
                    <input type="text" 
                           name="RegionName" 
                           id="id_RegionName" 
                           class="form-control" 
                           placeholder="Enter region name.."
                           value="{{ form.instance.RegionName|default_if_none:'' }}" 
                           required>
                    {% if form.regionname.errors %}
                        <div class="text-danger small mt-1">
                            {{ form.regionname.errors }}
                        </div>
                    {% endif %}
                </div>

                <!-- If there are other fields in your form, they will render below -->
              

                <button type="submit" class="btn btn-success w-100 mt-3">
                    Save Region
                </button>

            </form>

            <a href="{% url 'region_list' %}" class="btn btn-secondary w-100 mt-2">
                Back to Region List
            </a>

        </div>

    </div>
</div>

{% endblock %}
