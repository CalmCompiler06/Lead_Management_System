<!DOCTYPE html>
<html>
<head>

    <title>Lead Analytics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Lead Analytics</h3>
        </div>

        

            <div style="width: 400px; height: 400px; margin: auto;">
    <canvas id="leadChart"></canvas>
</div>
            {{ labels|json_script:"labels-data" }}
            {{ counts|json_script:"counts-data" }}

        

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>

const labels =
JSON.parse(
document.getElementById('labels-data').textContent
);

const counts =
JSON.parse(
document.getElementById('counts-data').textContent
);

new Chart(
document.getElementById('leadChart'),
{
    type: 'pie',

    data: {

        labels: labels,

        datasets: [{

            data: counts,

            backgroundColor: [

                '#36A2EB',
                '#FF6384',
                '#FFCE56',
                '#4BC0C0',
                '#9966FF',
                '#FF9F40'

            ]
        }]
    }
});

</script>

</body>
</html>
